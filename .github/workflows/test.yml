name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter versions (platform claims must match what ran)
        shell: bash
        run: |
          echo "os: ${{ matrix.os }}"
          python --version
          python3 --version
          which python python3
      - name: Run offline test suites
        shell: bash
        run: |
          set -uo pipefail
          ran=0
          fail=0
          if [ -f tests/run.sh ]; then
            echo "== bash tests/run.sh"
            bash tests/run.sh || fail=1
            ran=$((ran + 1))
          else
            for f in tests/test*.py; do
              [ -e "$f" ] || continue
              echo "== python3 $f"
              python3 "$f" || fail=1
              ran=$((ran + 1))
            done
          fi
          if [ "$ran" -eq 0 ]; then
            echo "FAIL: no suite matched tests/run.sh or tests/test*.py" >&2
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: a test suite exited non-zero" >&2
            exit 1
          fi
          echo "ran $ran suite invocation(s); all passed (python3 $(python3 -V))"
